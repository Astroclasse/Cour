<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030303;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            height: 100vh;
        }

        .background-orb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
        }

        form {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 107, 107, 0.05);
            display: inline-block;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateY(20px);
            opacity: 0;
            animation: appairageForm 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        form:hover {
            transform: translateY(17px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 107, 107, 0.15);
            border-color: rgba(255, 107, 107, 0.2);
        }

        div.main-container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        div.logo {
            margin-bottom: 25px;
        }

        h1 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 32px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: appairageTitre 0.8s ease forwards;
        }

        label {
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            display: inline-block;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 280px;
            padding: 14px;
            margin-top: 6px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b6b, #5227FF);
            background-size: 200% auto;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="submit"]:hover {
            background-position: right center;
            box-shadow: 0 8px 25px rgba(82, 39, 255, 0.4);
            transform: scale(1.02);
        }

        input[type="submit"]:active {
            transform: scale(0.98);
        }

        p#messagerror {
            color: #ff0000;
            font-size: 14px;
            margin-top: 15px;
            transition: opacity 0.3s ease;
        }

        @keyframes appairageTitre {
            to {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
            }
        }

        @keyframes appairageForm {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="background-orb">
        <canvas id="orbCanvas"></canvas>
        <div class="vignette"></div>
    </div>

    <div class="main-container">
        <div class="logo">
            <h1 style="font-family: 'Fredoka One', cursive;">
                Connectez-vous pour continuer...
            </h1>
        </div>

        <form id="loginForm">
            <label for="username" id="usernameLabel">Nom d'utilisateur</label><br>
            <input type="text" id="username" autocomplete="off" required><br>

            <label for="password" id="passwordLabel">Mot de passe</label><br>
            <input type="password" id="password" required><br>

            <input type="submit" value="Login">
        </form>
        <p id="messagerror"></p>
    </div>
    <script src="login1.js"></script>
    <script src="orb.js"></script>

</body>
</html>
