<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1"><title>RevisApp Cloud</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#635bff;--danger:#ef4444;--shadow:0 12px 35px #10182812}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% 0,#eef0ff 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:#ffffffdc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffffaa}.topin{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px #635bff40;animation:float 4s ease-in-out infinite}.brand small{display:block;color:var(--muted);font-weight:500}
.container{max-width:1120px;margin:auto;padding:34px 18px 60px}.hero{padding:34px 0 28px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:0 0 12px;letter-spacing:-.04em}.hero p{max-width:700px;color:var(--muted);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px;text-align:left;box-shadow:0 2px 7px #10182808;transition:transform .22s,box-shadow .22s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.emoji{font-size:28px}.card h3{margin:12px 0 4px}.bar{height:3px;position:absolute;left:0;right:0;bottom:0}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:15px 0 20px}.title{display:flex;align-items:center;gap:12px}.title .emoji{font-size:34px}.title h2{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 15px;transition:transform .15s,filter .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.primary{color:white;background:linear-gradient(135deg,#635bff,#7c3aed);box-shadow:0 8px 18px #635bff25}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff1f2;color:#dc2626}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;outline:0;margin-bottom:15px;box-shadow:0 2px 6px #10182805}.search:focus{border-color:#8b83ff;box-shadow:0 0 0 4px #635bff15}
.file{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;display:flex;align-items:center;gap:13px;animation:rise .35s both}.fileicon{width:44px;height:44px;border-radius:12px;background:#f1f2ff;display:grid;place-items:center;font-size:21px;flex:none}.filemain{min-width:0;flex:1}.filemain strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filemain span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.empty{text-align:center;color:var(--muted);padding:65px 15px}
.overlay{position:fixed;inset:0;background:#10182866;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .2s}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 25px 70px #10182835;animation:pop .25s}.modal h2{margin:0 0 5px}.modal label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0}.modal textarea{min-height:130px;resize:vertical}.drop{border:2px dashed #cfd2ff;background:#f8f8ff;border-radius:15px;padding:22px;text-align:center;transition:.2s}.drop.drag{background:#eeecff;transform:scale(1.01)}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.viewer{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow)}.viewer pre{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-family:inherit}.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:18px}
.toast{position:fixed;right:18px;left:18px;bottom:18px;z-index:50;background:#101828;color:#fff;border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);animation:pop .2s;max-width:420px;margin-left:auto;word-wrap:break-word}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes float{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="app"></div>
<script>
const C=[["francais","Français","📖","#6366f1"],["mathematiques","Mathématiques","📐","#f59e0b"],["histoire-geo","Histoire-Géo","🌍","#ef4444"],["physique-chimie","Physique-Chimie","⚗️","#10b981"],["svt","SVT","🌿","#8b5cf6"],["technologie","Technologie","💻","#3b82f6"],["anglais","Anglais","🇬🇧","#ec4899"],["allemand","Allemand","🇩🇪","#14b8a6"],["autre","Autre","📁","#78716c"]];
const EXT=[".doc",".docx",".pdf",".txt",".ppt",".pptx",".mp3"];
let active=null,items=[],query="",loading=false;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const cat=id=>C.find(x=>x[0]===id);
const fmt=n=>n<1024?n+" o":n<1048576?(n/1024).toFixed(1)+" Ko":(n/1048576).toFixed(1)+" Mo";
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),4500)}
async function api(url,opt={}){let r=await fetch(url,opt);if(!r.ok){let msg="Erreur serveur ("+r.status+")";try{let t=await r.text();try{let j=JSON.parse(t);msg=j.error||j.message||t||msg}catch(_){if(t)msg=t}}catch(_){}throw Error(msg)}return r}
async function load(){loading=true;render();try{let r=await api("/api/files");items=await r.json()}catch(e){toast("Impossible de contacter le serveur : "+e.message)}finally{loading=false;render()}}
function filtered(){return items.filter(x=>(!active||x.category===active)&&(!query||(`${x.name} ${x.title||""}`).toLowerCase().includes(query.toLowerCase())))}
function home(){let total=items.length;return `<div class="top"><div class="topin"><div class="brand"><div class="logo">📚</div><div>RevisApp<small>Stockage cloud</small></div></div><button class="btn primary" onclick="openUpload()">＋ Ajouter</button></div></div><main class="container"><section class="hero"><h1>Tes révisions,<br>partout avec toi.</h1><p>Stocke tes fiches et documents sur ton espace RevisApp. Compatible ordinateur, tablette et mobile.</p><div class="stats"><span class="pill">☁️ ${total} fichier${total!==1?"s":""}</span><span class="pill">📄 Word · PDF · TXT · PowerPoint</span><span class="pill">🎵 MP3</span></div></section><div class="grid">${C.map(c=>{let n=items.filter(x=>x.category===c[0]).length;return `<button class="card" onclick="active='${c[0]}';query='';render()"><span class="emoji">${c[2]}</span><h3>${c[1]}</h3><div class="muted">${n} fichier${n!==1?"s":""}</div><div class="bar" style="background:${c[3]}"></div></button>`}).join("")}</div></main>`}
function fileIcon(name){let e=name.toLowerCase().slice(name.lastIndexOf("."));return e===".mp3"?"🎵":e===".pdf"?"📕":e.includes("ppt")?"📊":e===".txt"?"📝":e.includes("doc")?"📘":"📄"}
function listView(){let c=cat(active),arr=filtered();return `<div class="top"><div class="topin"><div class="brand"><div class="logo">${c[2]}</div><div>${c[1]}<small>${arr.length} résultat${arr.length!==1?"s":""}</small></div></div><button class="btn primary" onclick="openUpload()">＋ Ajouter</button></div></div><main class="container"><button class="back" onclick="active=null;query='';render()">← Toutes les matières</button><div class="sectionhead"><div class="title"><span class="emoji">${c[2]}</span><div><h2>${c[1]}</h2><div class="muted">${items.filter(x=>x.category===active).length} fichier(s)</div></div></div></div><input class="search" placeholder="🔎 Rechercher…" value="${esc(query)}" oninput="query=this.value;render()">${loading?'<div class="empty">Chargement…</div>':arr.length?arr.map((f,i)=>`<article class="file" style="animation-delay:${i*35}ms"><div class="fileicon">${fileIcon(f.name)}</div><div class="filemain"><strong>${esc(f.title||f.name)}</strong><span>${esc(f.name)} · ${fmt(f.size)} · ${new Date(f.createdAt).toLocaleDateString("fr-FR")}</span></div><div class="actions"><button class="iconbtn" onclick="downloadFile('${esc(f.key)}')" title="Télécharger">⬇️</button><button class="iconbtn danger" onclick="deleteFile('${esc(f.key)}')" title="Supprimer">🗑️</button></div></article>`).join(""):'<div class="empty">📂<br><br>Aucun fichier dans cette matière.<br><br><button class="btn primary" onclick="openUpload()">Ajouter un fichier</button></div>'}</main>`}
function render(){document.getElementById("app").innerHTML=active?listView():home()}
function openUpload(){let bg=document.createElement("div");bg.className="overlay";bg.innerHTML=`<div class="modal"><h2>Ajouter un fichier</h2><div class="muted">Le fichier sera envoyé dans ton espace cloud.</div><label>Matière</label><select id="cat">${C.map(c=>`<option value="${c[0]}" ${c[0]===active?"selected":""}>${c[2]} ${c[1]}</option>`).join("")}</select><label>Titre (facultatif)</label><input id="title" placeholder="Ex. Chapitre 3 — Les fonctions"><label>Fichier</label><div class="drop" id="drop">📎<br><b>Choisir un fichier</b><br><span class="muted">Word, PDF, TXT, PowerPoint, MP3…</span><input id="file" type="file" accept=".doc,.docx,.pdf,.txt,.ppt,.pptx,.mp3" hidden></div><div class="foot"><button class="btn ghost" onclick="this.closest('.overlay').remove()">Annuler</button><button class="btn primary" id="send">☁️ Envoyer</button></div></div>`;document.body.append(bg);let file=bg.querySelector("#file"),drop=bg.querySelector("#drop");drop.onclick=()=>file.click();file.onchange=()=>drop.innerHTML="📎 <b>"+esc(file.files[0]?.name||"Fichier choisi")+"</b>";["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",x=>{file.files=x.dataTransfer.files;drop.innerHTML="📎 <b>"+esc(file.files[0]?.name||"Fichier choisi")+"</b>"});bg.querySelector("#send").onclick=async()=>{let f=file.files[0];if(!f)return toast("Choisis un fichier.");if(f.size>4*1024*1024)return toast("Fichier trop volumineux : la limite est de 4 Mo.");let qs=new URLSearchParams({filename:f.name,category:bg.querySelector("#cat").value,title:bg.querySelector("#title").value});let b=bg.querySelector("#send");b.disabled=true;b.textContent="☁️ Envoi…";try{await api("/api/files?"+qs.toString(),{method:"POST",body:f,headers:{"content-type":f.type||"application/octet-stream"}});bg.remove();toast("Fichier enregistré.");await load()}catch(e){b.disabled=false;b.textContent="☁️ Envoyer";toast("Erreur : "+e.message)}}}
async function deleteFile(key){if(!confirm("Supprimer définitivement ce fichier ?"))return;try{await api("/api/files/"+encodeURIComponent(key),{method:"DELETE"});toast("Fichier supprimé.");await load()}catch(e){toast("Erreur : "+e.message)}}
function downloadFile(key){window.location.href="/api/files/"+encodeURIComponent(key)}
load();
</script></body></html>
