<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1"><title>RevisApp Cloud</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#635bff;--danger:#ef4444;--shadow:0 12px 35px #10182812}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
background:radial-gradient(circle at 20% 0,#eef0ff 0,transparent 32%),
radial-gradient(circle at 85% 15%,#f0e9ff 0,transparent 40%),
linear-gradient(120deg,#f6f7fb,#eef0ff,#f6f7fb,#fdeeff,#f6f7fb);
background-size:100% 100%,100% 100%,300% 300%;
animation:bgshift 22s ease-in-out infinite}
@keyframes bgshift{0%{background-position:0 0,0 0,0% 50%}50%{background-position:0 0,0 0,100% 50%}100%{background-position:0 0,0 0,0% 50%}}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}
.ico{flex:none;vertical-align:middle;transition:transform .25s ease}
.top{position:sticky;top:0;z-index:5;background:#ffffffdc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffffaa;animation:slidedown .5s cubic-bezier(.22,1,.36,1) both}
@keyframes slidedown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.topin{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;
background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899,#6366f1);background-size:300% 300%;
box-shadow:0 10px 22px #635bff40;animation:float 4s ease-in-out infinite,logoglow 6s ease infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes logoglow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand small{display:block;color:var(--muted);font-weight:500}
.container{max-width:1120px;margin:auto;padding:34px 18px 60px}
.hero{padding:34px 0 28px;animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:0 0 12px;letter-spacing:-.04em;
background:linear-gradient(100deg,#101828 30%,#635bff 50%,#101828 70%);background-size:220% auto;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-220% center}}
.hero p{max-width:700px;color:var(--muted);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;
animation:rise .5s both;transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-2px);box-shadow:0 6px 14px #10182812}
.pill:nth-child(1){animation-delay:.05s}.pill:nth-child(2){animation-delay:.12s}.pill:nth-child(3){animation-delay:.19s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px;text-align:left;
box-shadow:0 2px 7px #10182808;transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s;
animation:cardin .5s cubic-bezier(.22,1,.36,1) both}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at var(--mx,50%) var(--my,0%),#635bff14,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::after{opacity:1}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--shadow)}
.card:active{transform:translateY(-2px) scale(.99)}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.card .emoji{color:var(--text);display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.card:hover .emoji{transform:scale(1.15) rotate(-6deg)}
.card h3{margin:12px 0 4px}
.bar{height:3px;position:absolute;left:0;right:0;bottom:0;transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.card:hover .bar{transform:scaleX(1)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:15px 0 20px;animation:rise .5s both}
.title{display:flex;align-items:center;gap:12px}.title h2{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 15px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .15s,box-shadow .2s;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.03)}
.btn:active{transform:translateY(0) scale(.96)}
.btn:focus-visible{outline:2px solid #635bff;outline-offset:2px}
.primary{color:white;background:linear-gradient(135deg,#635bff,#7c3aed);background-size:160% 160%;box-shadow:0 8px 18px #635bff25;animation:gradmove 5s ease infinite}
@keyframes gradmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.primary:hover .ico{transform:rotate(90deg)}
.ghost{background:#fff;border:1px solid var(--line)}
.ghost:hover{background:#fafaff}
.danger{background:#fff1f2;color:#dc2626}
.iconbtn.danger:hover .ico{transform:rotate(8deg) scale(1.1)}
.search-wrap{position:relative;margin-bottom:15px;animation:rise .5s .1s both}
.search-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);transition:color .2s}
.search-wrap:focus-within .ico{color:#635bff}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px 13px 40px;outline:0;box-shadow:0 2px 6px #10182805;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:#8b83ff;box-shadow:0 0 0 4px #635bff15}
.file{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;display:flex;align-items:center;gap:13px;
animation:rise .4s cubic-bezier(.22,1,.36,1) both;transition:transform .2s,box-shadow .2s,border-color .2s}
.file:hover{transform:translateX(4px);box-shadow:0 6px 18px #10182810;border-color:#d8dbff}
.fileicon{width:44px;height:44px;border-radius:12px;background:#f1f2ff;display:grid;place-items:center;color:#635bff;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
.file:hover .fileicon{transform:rotate(-6deg) scale(1.08);background:#e6e7ff}
.filemain{min-width:0;flex:1}
.filemain strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filemain span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.actions{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;display:inline-flex;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s}
.iconbtn:hover{transform:translateY(-2px) scale(1.06);background:#f8f8ff;border-color:#c9cdff}
.iconbtn:active{transform:scale(.92)}
.empty{text-align:center;color:var(--muted);padding:65px 15px;animation:rise .5s both}
.empty .ico{display:block;margin:0 auto 10px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.overlay{position:fixed;inset:0;background:#10182866;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 25px 70px #10182835;animation:pop .3s cubic-bezier(.22,1,.36,1)}
.modal h2{margin:0 0 5px}
.modal label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0;transition:border-color .2s,box-shadow .2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:#8b83ff;box-shadow:0 0 0 4px #635bff15}
.modal textarea{min-height:130px;resize:vertical}
.drop{border:2px dashed #cfd2ff;background:#f8f8ff;border-radius:15px;padding:22px;text-align:center;transition:.25s;color:var(--muted)}
.drop .ico{display:block;margin:0 auto 8px;color:#635bff;animation:bob 2.6s ease-in-out infinite}
.drop:hover{border-color:#a9adff;background:#f2f1ff}
.drop.drag{background:#eeecff;transform:scale(1.02);border-color:#635bff}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.viewer{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow)}
.viewer pre{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-family:inherit}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px;transition:color .2s,transform .2s}
.back:hover{color:var(--text);transform:translateX(-3px)}
.back:hover .ico{transform:translateX(-2px)}
.toast{position:fixed;right:18px;left:18px;bottom:18px;z-index:50;background:#101828;color:#fff;border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);animation:toastin .35s cubic-bezier(.34,1.56,.64,1);max-width:420px;margin-left:auto;word-wrap:break-word}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="app"></div>
<script>
const ICONS={
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
ruler:'<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
flask:'<path d="M9 2v6.5L4 20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1L15 8.5V2"/><path d="M9 2h6"/><path d="M6.5 14h11"/>',
leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13.5 11 9"/>',
laptop:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
languages:'<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
folder_open:'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
library:'<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
file_text:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
presentation:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
arrow_left:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
download:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
paperclip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
table:'<path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>',
code:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
terminal:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>'
};
function ic(name,size){size=size||18;return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||""}</svg>`}

const C=[["francais","Français","book","#6366f1"],["mathematiques","Mathématiques","ruler","#f59e0b"],["histoire-geo","Histoire-Géo","globe","#ef4444"],["physique-chimie","Physique-Chimie","flask","#10b981"],["svt","SVT","leaf","#8b5cf6"],["technologie","Technologie","laptop","#3b82f6"],["anglais","Anglais","languages","#ec4899"],["allemand","Allemand","languages","#14b8a6"],["autre","Autre","folder","#78716c"]];
const EXT=[".doc",".docx",".pdf",".txt",".ppt",".pptx",".mp3",".png",".jpg",".jpeg",".xlsx",".csv",".html",".css",".js",".py",".exe",".bat",".zip"];
let active=null,items=[],query="",loading=false;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const cat=id=>C.find(x=>x[0]===id);
const fmt=n=>n<1024?n+" o":n<1048576?(n/1024).toFixed(1)+" Ko":(n/1048576).toFixed(1)+" Mo";
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),4500)}
async function api(url,opt={}){let r=await fetch(url,opt);if(!r.ok){let msg="Erreur serveur ("+r.status+")";try{let t=await r.text();try{let j=JSON.parse(t);msg=j.error||j.message||t||msg}catch(_){if(t)msg=t}}catch(_){}throw Error(msg)}return r}
async function load(){loading=true;render();try{let r=await api("/api/files");items=await r.json()}catch(e){toast("Impossible de contacter le serveur : "+e.message)}finally{loading=false;render()}}
function filtered(){return items.filter(x=>(!active||x.category===active)&&(!query||(`${x.name} ${x.title||""}`).toLowerCase().includes(query.toLowerCase())))}
function home(){let total=items.length;return `<div class="top"><div class="topin"><div class="brand"><div class="logo">${ic('library',24)}</div><div>RevisApp<small>Stockage cloud</small></div></div><button class="btn primary" onclick="openUpload()">${ic('plus',15)} Ajouter</button></div></div><main class="container"><section class="hero"><h1>Tes révisions,<br>partout avec toi.</h1><p>Stocke tes fiches et documents sur ton espace RevisApp. Compatible ordinateur, tablette et mobile.</p><div class="stats"><span class="pill">${ic('cloud',14)} ${total} fichier${total!==1?"s":""}</span><span class="pill">${ic('file_text',14)} Word · PDF · TXT · PowerPoint · Excel</span><span class="pill">${ic('music',14)} MP3 · Images · Code</span></div></section><div class="grid">${C.map((c,i)=>{let n=items.filter(x=>x.category===c[0]).length;return `<button class="card" style="animation-delay:${i*45}ms" onclick="active='${c[0]}';query='';render()"><span class="emoji">${ic(c[2],28)}</span><h3>${c[1]}</h3><div class="muted">${n} fichier${n!==1?"s":""}</div><div class="bar" style="background:${c[3]}"></div></button>`}).join("")}</div></main>`}
function fileIcon(name){let e=name.toLowerCase().slice(name.lastIndexOf("."));
if(e===".mp3")return "music";
if([".png",".jpg",".jpeg"].includes(e))return "image";
if([".xlsx",".csv"].includes(e))return "table";
if([".html",".css",".js",".py"].includes(e))return "code";
if([".exe",".bat"].includes(e))return "terminal";
if(e===".zip")return "archive";
if(e.includes("ppt"))return "presentation";
return "file_text"}
function listView(){let c=cat(active),arr=filtered();return `<div class="top"><div class="topin"><div class="brand"><div class="logo">${ic(c[2],24)}</div><div>${c[1]}<small>${arr.length} résultat${arr.length!==1?"s":""}</small></div></div><button class="btn primary" onclick="openUpload()">${ic('plus',15)} Ajouter</button></div></div><main class="container"><button class="back" onclick="active=null;query='';render()">${ic('arrow_left',16)} Toutes les matières</button><div class="sectionhead"><div class="title"><span class="emoji">${ic(c[2],32)}</span><div><h2>${c[1]}</h2><div class="muted">${items.filter(x=>x.category===active).length} fichier(s)</div></div></div></div><div class="search-wrap">${ic('search',16)}<input class="search" placeholder="Rechercher…" value="${esc(query)}" oninput="query=this.value;render()"></div>${loading?'<div class="empty">Chargement…</div>':arr.length?arr.map((f,i)=>`<article class="file" style="animation-delay:${i*35}ms"><div class="fileicon">${ic(fileIcon(f.name),22)}</div><div class="filemain"><strong>${esc(f.title||f.name)}</strong><span>${esc(f.name)} · ${fmt(f.size)} · ${new Date(f.createdAt).toLocaleDateString("fr-FR")}</span></div><div class="actions"><button class="iconbtn" onclick="downloadFile('${esc(f.key)}')" title="Télécharger">${ic('download',16)}</button><button class="iconbtn danger" onclick="deleteFile('${esc(f.key)}')" title="Supprimer">${ic('trash',16)}</button></div></article>`).join(""):`<div class="empty">${ic('folder_open',40)}Aucun fichier dans cette matière.<br><br><button class="btn primary" onclick="openUpload()">Ajouter un fichier</button></div>`}</main>`}
function render(){document.getElementById("app").innerHTML=active?listView():home();document.querySelectorAll(".card").forEach(el=>{el.addEventListener("mousemove",e=>{let r=el.getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-r.left)+"px");el.style.setProperty("--my",(e.clientY-r.top)+"px")})})}
function openUpload(){let bg=document.createElement("div");bg.className="overlay";bg.innerHTML=`<div class="modal"><h2>Ajouter un fichier</h2><div class="muted">Le fichier sera envoyé dans ton espace cloud.</div><label>Matière</label><select id="cat">${C.map(c=>`<option value="${c[0]}" ${c[0]===active?"selected":""}>${c[1]}</option>`).join("")}</select><label>Titre (facultatif)</label><input id="title" placeholder="Ex. Chapitre 3 — Les fonctions"><label>Fichier</label><div class="drop" id="drop">${ic('paperclip',26)}<b>Choisir un fichier</b><br><span class="muted">Word, PDF, Excel, Images, Code, ZIP, MP3…</span><input id="file" type="file" accept="${EXT.join(",")}" hidden></div><div class="foot"><button class="btn ghost" onclick="this.closest('.overlay').remove()">Annuler</button><button class="btn primary" id="send">${ic('cloud',15)} Envoyer</button></div></div>`;document.body.append(bg);let file=bg.querySelector("#file"),drop=bg.querySelector("#drop");drop.onclick=()=>file.click();file.onchange=()=>drop.innerHTML=ic('paperclip',18)+" <b>"+esc(file.files[0]?.name||"Fichier choisi")+"</b>";["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",x=>{file.files=x.dataTransfer.files;drop.innerHTML=ic('paperclip',18)+" <b>"+esc(file.files[0]?.name||"Fichier choisi")+"</b>"});bg.querySelector("#send").onclick=async()=>{let f=file.files[0];if(!f)return toast("Choisis un fichier.");if(f.size>4*1024*1024)return toast("Fichier trop volumineux : la limite est de 4 Mo.");let qs=new URLSearchParams({filename:f.name,category:bg.querySelector("#cat").value,title:bg.querySelector("#title").value});let b=bg.querySelector("#send");b.disabled=true;b.innerHTML=ic('cloud',15)+" Envoi…";try{await api("/api/files?"+qs.toString(),{method:"POST",body:f,headers:{"content-type":f.type||"application/octet-stream"}});bg.remove();toast("Fichier enregistré.");await load()}catch(e){b.disabled=false;b.innerHTML=ic('cloud',15)+" Envoyer";toast("Erreur : "+e.message)}}}
async function deleteFile(key){if(!confirm("Supprimer définitivement ce fichier ?"))return;try{await api("/api/files/"+encodeURIComponent(key),{method:"DELETE"});toast("Fichier supprimé.");await load()}catch(e){toast("Erreur : "+e.message)}}
function downloadFile(key){window.location.href="/api/files/"+encodeURIComponent(key)}
load();
</script></body></html>
