<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RevisApp - Vercel Blob</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f9fafb; --bg-card: #ffffff;
      --fg: #0f172a; --muted: #64748b;
      --border: #e5e7eb;
      --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-400: #9ca3af;
      --red-500: #ef4444; --red-50: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.05);
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--fg);
      -webkit-font-smoothing: antialiased; line-height: 1.5;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea { font-family: inherit; }
    .hidden { display: none !important; }

    /* HEADER */
    .header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 48px 16px;
    }
    .header-inner { max-width: 900px; margin: 0 auto; text-align: center; }
    .logo {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99,102,243,.35);
    }
    .logo svg { width: 28px; height: 28px; color: #fff; }
    .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    .header .sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
    .header .count { color: var(--muted); font-size: 12px; margin-top: 12px; }

    .container { max-width: 900px; margin: 0 auto; padding: 32px 16px; }

    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }

    .cat-card {
      position: relative; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; text-align: left;
      transition: transform .2s, box-shadow .2s; overflow: hidden;
    }
    .cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .cat-card .icon { font-size: 24px; display: block; margin-bottom: 8px; }
    .cat-card .label { font-weight: 600; font-size: 15px; }
    .cat-card .cf { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .cat-card .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .cat-card .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .cat-card .bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      transform: scaleX(0); transform-origin: left; transition: transform .2s;
    }
    .cat-card:hover .bar { transform: scaleX(1); }

    .footer-note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 40px; }

    /* CATEGORY VIEW */
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 13px; margin-bottom: 24px;
      transition: color .15s;
    }
    .back:hover { color: var(--fg); }
    .back svg { width: 16px; height: 16px; }

    .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .cat-title-wrap { display: flex; align-items: center; gap: 12px; }
    .cat-title-wrap .big-icon { font-size: 30px; }
    .cat-title-wrap h2 { font-size: 22px; font-weight: 700; }
    .cat-title-wrap .csub { color: var(--muted); font-size: 13px; }

    .btn { padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: all .15s; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--fg); }
    .btn-outline:hover { background: var(--gray-100); }
    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover { background: var(--gray-100); }

    .input {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 14px; background: #fff; color: var(--fg);
      outline: none; transition: border .15s;
    }
    .input:focus { border-color: #6366f1; }
    textarea.input { resize: none; min-height: 120px; line-height: 1.6; }
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--gray-400); }
    .search-wrap .input { padding-left: 36px; }

    /* FILE LIST */
    .file-list { display: flex; flex-direction: column; gap: 12px; }
    .file-card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; cursor: pointer; transition: box-shadow .2s;
    }
    .file-card:hover { box-shadow: var(--shadow-md); }
    .file-card .row { display: flex; justify-content: space-between; gap: 12px; }
    .file-card .fleft { flex: 1; min-width: 0; }
    .file-card .fhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .file-card .fhead svg { width: 16px; height: 16px; flex-shrink: 0; }
    .file-card .fhead h3 { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-card .fbody { font-size: 12px; color: var(--muted); margin-left: 24px; }
    .file-card .fdate { font-size: 11px; color: var(--muted); margin-left: 24px; margin-top: 4px; display: block; }
    .file-card .faction { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .file-card:hover .faction { opacity: 1; }

    .iconbtn { padding: 6px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
    .iconbtn:hover { background: var(--gray-100); color: var(--fg); }
    .iconbtn.del:hover { background: var(--red-50); color: var(--red-500); }
    .iconbtn svg { width: 16px; height: 16px; }

    .empty { text-align: center; padding: 64px 16px; }
    .empty .big { width: 64px; height: 64px; border-radius: 50%; background: var(--gray-100);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .empty .big svg { width: 28px; height: 28px; color: var(--gray-400); }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal {
      background: #fff; border-radius: 18px; width: 100%; max-width: 480px;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .modal-head { padding: 20px 24px 0; }
    .modal-head .mtitle { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
    .modal-head .mdesc { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .modal-body { padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
    .modal-body .lbl { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; display: block; }
    .modal-foot { padding: 16px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }

    .screen { animation: slidein .25s ease; }
    @keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CATEGORIES = [
      { id: "francais", label: "Français", color: "#6366F1", icon: "📖" },
      { id: "mathematiques", label: "Mathématiques", color: "#F59E0B", icon: "📐" },
      { id: "histoire-geo", label: "Histoire-Géo", color: "#EF4444", icon: "🌍" },
      { id: "physique-chimie", label: "Physique-Chimie", color: "#10B981", icon: "⚗️" },
      { id: "svt", label: "SVT", color: "#8B5CF6", icon: "🌿" },
      { id: "technologie", label: "Technologie", color: "#3B82F6", icon: "💻" },
      { id: "anglais", label: "Anglais", color: "#EC4899", icon: "🇬🇧" },
      { id: "allemand", label: "Allemand", color: "#14B8A6", icon: "🇩🇪" },
      { id: "autre", label: "Autre", color: "#78716C", icon: "📁" },
    ];

    const IC = {
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      chevronL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>',
    };

    let state = {
      filesList: [],
      activeCategory: null,
      searchQuery: "",
    };

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    async function fetchFiles() {
      try {
        const res = await fetch("/api/files");
        if (res.ok) {
          state.filesList = await res.json();
          render();
        }
      } catch (e) {
        console.error("Erreur de chargement des fichiers Vercel Blob", e);
      }
    }

    function getCatCount(catId) {
      return state.filesList.filter(f => f.category === catId).length;
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      if (state.activeCategory) renderCategory(app);
      else renderHome(app);
    }

    function renderHome(app) {
      const total = state.filesList.length;
      const header = document.createElement("div");
      header.className = "header";
      header.innerHTML = `
        <div class="header-inner screen">
          <div class="logo">${IC.book}</div>
          <h1>RevisApp</h1>
          <p class="sub">Vos fiches enregistrées directement sur Vercel Blob.</p>
          ${total > 0 ? `<p class="count">${total} fiche${total !== 1 ? "s" : ""} au total</p>` : ""}
        </div>
      `;
      app.appendChild(header);

      const container = document.createElement("div");
      container.className = "container screen";
      const grid = document.createElement("div");
      grid.className = "grid";

      CATEGORIES.forEach(cat => {
        const count = getCatCount(cat.id);
        const card = document.createElement("button");
        card.className = "cat-card";
        card.innerHTML = `
          <div class="top">
            <div>
              <span class="icon">${cat.icon}</span>
              <div class="label">${cat.label}</div>
              <div class="cf">${count === 0 ? "Aucune fiche" : count + " fiche" + (count !== 1 ? "s" : "")}</div>
            </div>
            <div class="dot" style="background:${count > 0 ? cat.color : "#D1D5DB"}"></div>
          </div>
          <div class="bar" style="background:${cat.color}"></div>
        `;
        card.addEventListener("click", () => {
          state.activeCategory = cat.id;
          state.searchQuery = "";
          render();
        });
        grid.appendChild(card);
      });
      container.appendChild(grid);
      app.appendChild(container);
    }

    function renderCategory(app) {
      const cat = CATEGORIES.find(c => c.id === state.activeCategory);
      const count = getCatCount(cat.id);

      const wrap = document.createElement("div");
      wrap.className = "screen";
      wrap.innerHTML = `
        <div style="max-width:760px;margin:0 auto;padding:24px 16px;">
          <button id="back" class="back">${IC.chevronL}<span>Toutes les matières</span></button>
          <div class="cat-header">
            <div class="cat-title-wrap">
              <span class="big-icon">${cat.icon}</span>
              <div>
                <h2>${cat.label}</h2>
                <div class="csub">${count} fiche${count !== 1 ? "s" : ""}</div>
              </div>
            </div>
            <button id="addBtn" class="btn btn-primary" style="background:${cat.color}">${IC.plus}<span style="margin-left:4px;">Ajouter</span></button>
          </div>
          <div class="search-wrap ${count > 0 ? "" : "hidden"}">
            ${IC.search}
            <input id="search" class="input" placeholder="Rechercher une fiche..." value="${escapeHtml(state.searchQuery)}" />
          </div>
          <div id="fileArea"></div>
        </div>
      `;
      app.appendChild(wrap);

      wrap.querySelector("#back").addEventListener("click", () => {
        state.activeCategory = null;
        render();
      });
      wrap.querySelector("#addBtn").addEventListener("click", () => openAddModal(cat));

      const si = wrap.querySelector("#search");
      if (si) si.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        renderFileArea(wrap.querySelector("#fileArea"), cat);
      });

      renderFileArea(wrap.querySelector("#fileArea"), cat);
    }

    function renderFileArea(area, cat) {
      const catFiles = state.filesList.filter(f => f.category === cat.id);
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = q
        ? catFiles.filter(f => f.title.toLowerCase().includes(q) || (f.content || "").toLowerCase().includes(q))
        : catFiles;

      if (filtered.length === 0) {
        area.innerHTML = `
          <div class="empty">
            <div class="big">${IC.note}</div>
            <p>${state.searchQuery ? "Aucun résultat trouvé." : "Aucune fiche dans cette matière."}</p>
          </div>
        `;
        return;
      }

      const list = document.createElement("div");
      list.className = "file-list";
      filtered.forEach(file => {
        const card = document.createElement("div");
        card.className = "file-card";
        card.innerHTML = `
          <div class="row">
            <div class="fleft">
              <div class="fhead">
                <span style="color:${cat.color}">${IC.file}</span>
                <h3>${escapeHtml(file.title)}</h3>
              </div>
              <div class="fbody">${escapeHtml(file.content || file.name)}</div>
            </div>
            <div class="faction">
              <button class="iconbtn del" title="Supprimer">${IC.trash}</button>
            </div>
          </div>
        `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".del")) {
            e.stopPropagation();
            deleteFile(file.key);
          } else {
            window.open(file.key, "_blank");
          }
        });

        list.appendChild(card);
      });
      area.innerHTML = "";
      area.appendChild(list);
    }

    async function deleteFile(key) {
      if (!confirm("Voulez-vous vraiment supprimer ce fichier de Vercel Blob ?")) return;
      try {
        await fetch("/api/files/" + encodeURIComponent(key), { method: "DELETE" });
        await fetchFiles();
      } catch (e) {
        alert("Erreur lors de la suppression.");
      }
    }

    function openAddModal(cat) {
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-head">
            <div class="mtitle">Ajouter une fiche</div>
            <div class="mdesc">Le fichier sera directement envoyé dans votre stockage Vercel Blob.</div>
          </div>
          <div class="modal-body">
            <div>
              <label class="lbl">Titre de la fiche</label>
              <input id="mTitle" class="input" placeholder="Ex: Chapitre 1..." />
            </div>
            <div>
              <label class="lbl">Description / Note (optionnel)</label>
              <textarea id="mContent" class="input" placeholder="Notes ou résumé..."></textarea>
            </div>
            <div>
              <label class="lbl">Fichier (PDF, Docx, TXT, MP3...)</label>
              <input type="file" id="mFile" class="input" />
            </div>
          </div>
          <div class="modal-foot">
            <button id="mCancel" class="btn btn-ghost">Annuler</button>
            <button id="mSave" class="btn btn-primary" style="background:${cat.color}">Enregistrer dans Vercel</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      overlay.querySelector("#mCancel").addEventListener("click", () => overlay.remove());
      overlay.querySelector("#mSave").addEventListener("click", async () => {
        const title = overlay.querySelector("#mTitle").value.trim() || "Fiche sans titre";
        const content = overlay.querySelector("#mContent").value;
        const fileInput = overlay.querySelector("#mFile");
        const file = fileInput.files[0];

        const btn = overlay.querySelector("#mSave");
        btn.disabled = true;
        btn.textContent = "Téléversement...";

        const fd = new FormData();
        fd.append("category", cat.id);
        fd.append("title", title);
        fd.append("content", content);
        if (file) fd.append("file", file);

        try {
          const res = await fetch("/api/files", { method: "POST", body: fd });
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.error || "Erreur de stockage");
          }
          overlay.remove();
          await fetchFiles();
        } catch (e) {
          alert("Erreur : " + e.message);
          btn.disabled = false;
          btn.textContent = "Enregistrer dans Vercel";
        }
      });
    }

    // Chargement initial
    fetchFiles();
  </script>
</body>
</html>
